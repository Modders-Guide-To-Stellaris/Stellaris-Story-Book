l_english:

 # for Purr~sar <3
 ssp_origin_mutual_connection: "Mutual Connection"
 ssp_origin_mutual_connection_desc: "§RWarning: This origin only works if there is an even number of empires using it / CO-OP Origin§!\n\nLong before interstellar travel, enigmatic signals echoed across the fabric of space... unintelligible, irregular, and undeniably alien. Initially dismissed as background radiation or sensor anomalies, these transmissions were later recognized as something far more deliberate: echoes of other civilizations bound by the same unknown force.\n\nWhether through reverse-engineered precursor technology, deeply buried ancient knowledge or other divine ways, this civilization has unlocked the ability to stabilize temporary rift ways, Links through space- and possibly time, allowing direct contact with another.\n\nThese connections offer opportunity, understanding, and risk. They cannot be forced, only invited, and once formed, they are not easily repeated. Each choice must be made with care."
 ssp_origin_mutual_connection_effects: "- Your civilization has the ability to share a §Ymysterious link§! with another across the stars.\n- placeholder?"

 #events
 ssp_origin.101.Name: "Stabilize Rift Link"
 ssp_origin.101.Desc: "Rift oscillations have reached a stable threshold. Using the harmonic anchors left behind by the forerunners, we can now initiate a transient link through folded space, and possibly, time.\n\nSeveral distant signals resonate with compatible signatures. We may open a connection with one of them, but the system is volatile; only one stable channel can be maintained before feedback destabilizes the gateway."
 ssp_origin.101a: "[ssp_connection_option_1.GetName]"
 ssp_origin.101.a.tooltip: "Open a controlled spatial rift with §Y[ssp_connection_option_1.GetName]§!. Expect temporal feedback. Link duration unknown."
 ssp_origin.101b: "[ssp_connection_option_2.GetName]"
 ssp_origin.101.b.tooltip: "Initiate Rift Protocol with §Y[ssp_connection_option_2.GetName]§!. Signal integrity will collapse after one attempt."
 ssp_origin.101c: "[ssp_connection_option_3.GetName]"
 ssp_origin.101.c.tooltip: "Stabilize entanglement wave with §Y[ssp_connection_option_3.GetName]§!. Warning: system cooldown will follow."
 ssp_origin.101d: "[ssp_connection_option_4.GetName]"
 ssp_origin.101.d.tooltip: "Bridge rift-space to §Y[ssp_connection_option_3.GetName]§!. Reconnection unlikely until drift resolves."
 ssp_origin.101e: "[ssp_connection_option_5.GetName]"
 ssp_origin.101.e.tooltip: "Tear open a micro-singularity corridor to §Y[ssp_connection_option_3.GetName]§!. Channel must collapse afterward."
 ssp_origin.101f: "We do not want to make a connection with these people"
 ssp_origin.101.f.tooltip: "Abort link attempt. Shutdown relay and release residual energy into void."

 ssp_origin.102.Name: "Incoming Connection"
 ssp_origin.102.Desc: "A foreign presence stirs the veil between our stars. Patterns encoded in gravitic noise coalesce into a signal, not a transmission in the traditional sense, but a call. They seek communion, not contact. To link our empires through the ancient latticework that threads the galaxy.\n\nThe gateway is taxing, and the pathways are not stable. But such a bond could offer rare insight... or open the door to something far worse."

 ssp_origin.103.Name: "System Overload"
 ssp_origin.103.Desc: "The strain of maintaining interstellar resonance proved too much for our systems. Feedback pulses shattered delicate stabilizers, and the conduits are now inert. Whatever opportunity was offered is lost... for now.\n\nThe veil remains silent, and shall, until the resonance stabilizes once more."